name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --timeout=3m
      # goreleaser runs `go mod tidy` before building. If that changes anything,
      # the release build's tree is dirty and Go stamps the version "+dirty".
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum
      # Release binaries embed the stdlib, so an unpatched toolchain ships the
      # vulnerability inside the artifact.
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -count=1 -v -covermode=count -json ./... > test.json
      - name: Annotate tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json
