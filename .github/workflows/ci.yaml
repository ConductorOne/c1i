name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --timeout=3m
      # goreleaser runs `go mod tidy` before building. If that changes anything,
      # the release build's tree is dirty and Go stamps the version "+dirty".
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code --stat go.mod go.sum
      # Release binaries embed the stdlib, so an unpatched toolchain ships the
      # vulnerability inside the artifact. Scanned per GOOS because reachability
      # is build-tag dependent -- a vulnerability reachable only on Windows is
      # invisible to a linux-only scan.
      - name: Check for known vulnerabilities
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          for goos in linux darwin windows; do
            echo "== govulncheck GOOS=$goos"
            GOOS=$goos govulncheck ./...
          done
      # c1i ships as a public release binary; gosec catches injection- and
      # traversal-class bugs gofmt/go vet don't. Findings are triaged with
      # per-line #nosec comments, never a blanket rule exclusion.
      - name: Run gosec
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -nosec-require-rules -nosec-require-justification ./...
      # A secret can be removed from HEAD and still sit exposed in a public
      # repo's history, so this needs full history, not the default shallow
      # clone.
      - name: Checkout full history for gitleaks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks detect --source . --no-banner
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -count=1 -v -covermode=count -json ./... > test.json
      - name: Annotate tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.6.0
        with:
          test-results: test.json
