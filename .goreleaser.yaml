version: 2

before:
  hooks:
    # No `go mod tidy` here: it rewrote go.mod mid-build and shipped v0.4.0 as
    # "+dirty". CI and the release workflow both assert tidiness instead.
    - go generate ./...

builds:
  - main: ./...
    env:
      - CGO_ENABLED=0

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - typo
      - lint
      - Merge pull request
